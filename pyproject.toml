[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandcamp_extract"
version = "0.2.0"
description = "Extract BandCamp .zip album folders to their appropriate place"
license = { text = "MIT" }
authors = [{ name = "Jonathan Montgomery", email = "jonathan.montgo@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "click==8.0.1",
    "tinytag>=1.10.1",
    "requests>=2.31.0",
    "iterfzf>=1.4.0",
]

[project.scripts]
bcextr = "bandcamp_extract.cli:cli"

[project.urls]
Homepage = "https://github.com/JonMontgo/bandcamp_extract"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
